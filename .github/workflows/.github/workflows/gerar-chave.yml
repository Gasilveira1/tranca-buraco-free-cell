name: Gerar chave de assinatura (rodar 1 vez só)
on:
  workflow_dispatch:
    inputs:
      senha:
        description: 'Crie uma senha (mín. 6 caracteres) — anote! Use a mesma em KEYSTORE_PASSWORD e KEY_PASSWORD'
        required: true
jobs:
  chave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Gerar
        env: { PW: '${{ inputs.senha }}' }
        run: |
          echo "::add-mask::$PW"
          keytool -genkeypair -v -keystore tranca.keystore -alias tranca -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Tranca Buraco Free Cell, C=BR"
          base64 -w0 tranca.keystore > KEYSTORE_B64.txt
          printf 'KEY_ALIAS = tranca\nKEYSTORE_PASSWORD = (a senha que voce digitou)\nKEY_PASSWORD = (a mesma senha)\nKEYSTORE_B64 = conteudo inteiro do arquivo KEYSTORE_B64.txt\n\nGUARDE tranca.keystore + senha no Google Drive. Sem eles voce nao atualiza o app.\n' > LEIA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chave-assinatura-BAIXE-E-GUARDE
          path: |
            tranca.keystore
            KEYSTORE_B64.txt
            LEIA.txt
          retention-days: 1
